name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dump-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Dump OIDC token claims (npm audience)
        run: |
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org")
          echo "$RESP" | python3 -c '
          import sys, json, base64
          jwt = json.load(sys.stdin)["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          '
