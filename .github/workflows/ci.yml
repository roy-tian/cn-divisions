name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test both entrypoints
        run: |
          node -e "const m = require('./dist/index.cjs'); if (!m.getDivision('11')) { process.exit(1) } console.log('cjs ok')"
          node -e "import('./dist/index.js').then((m) => { if (!m.getDivision('11')) { process.exit(1) } console.log('esm ok') })"
