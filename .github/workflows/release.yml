name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is needed to create the GitHub release;
      # id-token: write is needed for npm OIDC trusted publishing
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in a job that holds an OIDC publish token:
          # a poisoned cache could run attacker code with that token
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test both entrypoints
        run: node scripts/smoke-dist.mjs
      - name: Publish (tag must match package.json version)
        id: publish
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "### Publish skipped — tag/version mismatch" >> "$GITHUB_STEP_SUMMARY"
            echo "Tag \`v$TAG_VERSION\` does not match package.json version \`$PKG_VERSION\`; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "tag v$TAG_VERSION does not match package $PKG_VERSION - skipping publish"
            exit 0
          fi
          # From here on the tag is a real release: the GitHub release step
          # runs even when npm already has this version, so rerunning a job
          # whose publish succeeded but release creation failed recovers it
          echo "release=true" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "### Publish skipped — already on npm" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$PKG_NAME@$PKG_VERSION\` is already published to npm; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "$PKG_NAME@$PKG_VERSION is already on npm - skipping publish"
            exit 0
          fi
          # verbose surfaces the registry's reason when the OIDC token
          # exchange fails; otherwise npm silently falls back to ENEEDAUTH
          npm publish --provenance --access public --loglevel verbose
      - name: Create GitHub release
        if: steps.publish.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Extract this version's section from CHANGELOG.md as release notes
          awk -v ver="$VERSION" 'index($0, "## [" ver "]")==1{f=1;next} /^## \[/{f=0} f' \
            CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          # No --latest: create lets GitHub pick "Latest" by date and version,
          # and edit leaves it alone, so rerunning an older tag cannot steal it
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # rerun-safe: refresh the existing release's notes; with no
            # CHANGELOG section, keep whatever notes it already has
            if [ -s release-notes.md ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            fi
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
